[phases.setup]
nixPkgs = ['python311', 'gcc', 'poppler_utils', 'tesseract', 'libmagic']

[phases.install]
cmds = [
  'python3.11 -m pip install --upgrade pip',
  'python3.11 -m pip install -r requirements.txt --no-cache-dir'
]

[start]
cmd = 'python3.11 -m uvicorn main:app --host 0.0.0.0 --port $PORT'